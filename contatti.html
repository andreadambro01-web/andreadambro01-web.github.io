<body>
  <header class="header">
    <nav class="navbar" aria-label="Navigazione principale">
      <div class="container nav-container">
        <a class="navbar-brand" href="index.html">Andrea D'Ambrosio</a>
        <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-hidden="true">
        <label for="menu-toggle" class="burger" aria-label="Menu di navigazione">

          <li><a class="nav-link active" href="contatti.html">Contattami</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="section contact-page">
    <div class="container">
      <h1>Contattami</h1>
      <p>Se vuoi collaborare con me o ricevere informazioni, compila il form qui sotto.</p>
      
      <form id="contact-form" class="contact-form">
        <div>
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" autocomplete="name" required>
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div>
          <label for="messaggio">Messaggio</label>
          <textarea id="messaggio" name="messaggio" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn-dark-custom">
          Invia messaggio
        </button>
        <p id="status-msg"></p>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container text-center py-4">
      &copy; 2026 Andrea D'Ambrosio
    </div>
  </footer>

  <!-- EMAILJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function () {
      emailjs.init("c-NJzk-D12H1RQ-_X");
    })();

    const form = document.getElementById("contact-form");
    const statusMsg = document.getElementById("status-msg");

    if (form) {
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        emailjs.send("service_flytkot", "template_0nsf0xq", {
          from_name: document.getElementById("nome").value,
          from_email: document.getElementById("email").value,
          message: document.getElementById("messaggio").value
        }).then(() => {
          statusMsg.textContent = "Messaggio inviato con successo!";
          form.reset();
        }).catch(() => {
          statusMsg.textContent = "Errore nell'invio del messaggio.";
        });
      });
    }
  </script>
</body>
</html>
